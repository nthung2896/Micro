<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <!-- Background Circle/Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0355a2" />
      <stop offset="100%" stop-color="#0b2347" />
    </linearGradient>

    <!-- Warm Amber/Gold Gradient for Roof and Accent -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Vibrant Orange Coral Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e40" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0355a2" flood-opacity="0.35" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="12" y="12" width="216" height="216" rx="48" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="14" y="14" width="212" height="212" rx="46" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Background Apartment Tower (Right Side) -->
  <rect x="128" y="58" width="56" height="116" rx="8" fill="#1e3a8a" opacity="0.95" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <!-- Tower Balconies / Illuminated Windows -->
  <rect x="138" y="72" width="14" height="10" rx="2.5" fill="#ffffff" opacity="0.9" />
  <rect x="160" y="72" width="14" height="10" rx="2.5" fill="#ffffff" opacity="0.9" />
  <rect x="138" y="92" width="14" height="10" rx="2.5" fill="#ffffff" opacity="0.9" />
  <rect x="160" y="92" width="14" height="10" rx="2.5" fill="#fcd34d" />
  <rect x="138" y="112" width="14" height="10" rx="2.5" fill="#fcd34d" />
  <rect x="160" y="112" width="14" height="10" rx="2.5" fill="#ffffff" opacity="0.9" />
  <rect x="138" y="132" width="14" height="10" rx="2.5" fill="#ffffff" opacity="0.9" />
  <rect x="160" y="132" width="14" height="10" rx="2.5" fill="#ffffff" opacity="0.9" />

  <!-- Cozy Front House (Left/Center) -->
  <!-- Chimney -->
  <rect x="68" y="80" width="12" height="24" rx="3" fill="url(#accentGrad)" />

  <!-- Modern Pitched Roof -->
  <path d="M42 120 L96 74 L150 120" stroke="url(#warmGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
  
  <!-- House Base Body -->
  <path d="M54 116 L96 80 L138 116 V168 C138 172.4 134.4 176 130 176 H62 C57.6 176 54 172.4 54 168 Z" fill="#ffffff" />
  
  <!-- Welcoming Arch Door -->
  <path d="M82 176 V138 C82 131.4 88.3 126 96 126 C103.7 126 110 131.4 110 138 V176 Z" fill="url(#bgGrad)" />
  <!-- Golden Doorknob -->
  <circle cx="104" cy="154" r="2.5" fill="url(#warmGrad)" />

  <!-- Attic Round Window -->
  <circle cx="96" cy="108" r="7" fill="url(#accentGrad)" />

  <!-- Ground Accent Line / Location Base -->
  <path d="M38 190 H202" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.75" />
</svg>
