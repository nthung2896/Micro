# ==============================================================================
# UPSTREAM DEFINITIONS (Docker internal DNS names)
# ==============================================================================
upstream identity_backend {
    server identity-service:5001;
    keepalive 32;
}

upstream kpi_backend {
    server kpi-service:5003;
    keepalive 32;
}

upstream asset_backend {
    server asset-service:5005;
    keepalive 32;
}

upstream room_backend {
    server room-service:5002;
    keepalive 32;
}

upstream portal_frontend {
    server portal-client:3000;
    keepalive 32;
}

upstream kpi_frontend {
    server kpi-client:9696;
    keepalive 32;
}

upstream asset_frontend {
    server asset-client:9797;
    keepalive 32;
}

# ==============================================================================
# 1. API GATEWAY SERVER (Lắng nghe cổng 80 & 5000 cho các cuộc gọi API)
# ==============================================================================
server {
    listen 80;
    listen 5000;
    server_name localhost _;

    # Proxy Headers chuẩn cho Microservices & SignalR / WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # --------------------------------------------------------------------------
    # 1.1. SSO / Authentication Route (Identity Service)
    # --------------------------------------------------------------------------
    location /api/auth/ {
        proxy_pass http://identity_backend/api/auth/;
    }

    # --------------------------------------------------------------------------
    # 1.2. Quản Lý Tài Sản API (Asset Service)
    # Client gọi: /api/asset/Role/GetData -> Nginx gọt bỏ '/asset' thành /api/Role/GetData
    # --------------------------------------------------------------------------
    location /api/asset/ {
        rewrite ^/api/asset/(.*)$ /api/$1 break;
        proxy_pass http://asset_backend;
    }

    location /api/assets/ {
        proxy_pass http://asset_backend/api/assets/;
    }

    # --------------------------------------------------------------------------
    # 1.3. Đánh Giá KPI API (KPI Service)
    # Client gọi: /api/kpi/Role/GetData -> Nginx gọt bỏ '/kpi' thành /api/Role/GetData
    # --------------------------------------------------------------------------
    location /api/kpi/ {
        rewrite ^/api/kpi/(.*)$ /api/$1 break;
        proxy_pass http://kpi_backend;
    }

    # --------------------------------------------------------------------------
    # 1.4. Quản Lý Phòng Trọ (Room Service)
    # --------------------------------------------------------------------------
    location /api/rooms/ {
        proxy_pass http://room_backend/api/rooms/;
    }

    location /api/PhongTro/ {
        proxy_pass http://room_backend/api/PhongTro/;
    }

    # --------------------------------------------------------------------------
    # 1.5. Fallback Route cho API chung
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://kpi_backend/api/;
    }

    # --------------------------------------------------------------------------
    # 1.6. Route Giao Diện Mặc Định (Portal Hub - Cổng Dịch Vụ)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://portal_frontend;
    }
}

# ==============================================================================
# 2. SUBDOMAIN / VIRTUAL HOST ROUTING (Tùy chọn: dùng khi có Domain/DNS)
# ==============================================================================

# Virtual Host cho KPI (ví dụ: kpi.local hoặc kpi.ebizoffice.vn)
server {
    listen 80;
    server_name kpi.local kpi.ebizoffice.vn;

    location / {
        proxy_pass http://kpi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://kpi_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/auth/ {
        proxy_pass http://identity_backend/api/auth/;
        proxy_set_header Host $host;
    }
}

# Virtual Host cho Tài Sản (ví dụ: taisan.local hoặc asset.ebizoffice.vn)
server {
    listen 80;
    server_name taisan.local asset.local asset.ebizoffice.vn taisan.ebizoffice.vn;

    location / {
        proxy_pass http://asset_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://asset_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/auth/ {
        proxy_pass http://identity_backend/api/auth/;
        proxy_set_header Host $host;
    }
}
